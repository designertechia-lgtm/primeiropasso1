server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — todas as rotas retornam index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca cacheia no browser — garante que toda visita
    # pega o HTML novo (apontando pros hashes novos dos assets).
    # Padrao Vercel/Netlify: HTML revalida, assets imutaveis.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires 0;
    }

    # Cache de assets estáticos (JS/CSS/fontes gerados pelo Vite)
    # Vite gera nome com hash (main-abc123.js), entao immutable e seguro.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
